<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سفاري | إتمام الحجز - تجربة سلسة</title>
    <meta name="description" content="أكمل حجز رحلتك مع سفاري بكل سهولة وأمان">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2a9d8f;
            --primary-dark: #21867a;
            --secondary: #e76f51;
            --accent: #f4a261;
            --bg-dark: #121212;
            --bg-card-dark: #1e1e1e;
            --text-dark: #ffffff;
            --text-muted-dark: #b0b0b0;
            --bg-light: linear-gradient(135deg, #e0f7fa 0%, #c8e6e0 100%);
            --bg-card-light: rgba(255, 255, 255, 0.9);
            --text-light: #1e3c3c;
            --text-muted-light: #2c5a5a;
            --border-light: rgba(42, 157, 143, 0.2);
            --border-dark: #333;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
            --glow: 0 0 20px rgba(42, 157, 143, 0.4);
        }

        [data-theme="dark"] {
            --bg: var(--bg-dark);
            --bg-card: var(--bg-card-dark);
            --text: var(--text-dark);
            --text-muted: var(--text-muted-dark);
            --border: var(--border-dark);
        }

        [data-theme="light"] {
            --bg: var(--bg-light);
            --bg-card: var(--bg-card-light);
            --text: var(--text-light);
            --text-muted: var(--text-muted-light);
            --border: var(--border-light);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            direction: rtl;
            text-align: right;
            transition: background 0.3s, color 0.2s;
            overflow-x: hidden;
            position: relative;
        }

        body[dir="ltr"] {
            direction: ltr;
            text-align: left;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* ========== PROGRESS BAR ========== */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            z-index: 1001;
            transition: width 0.1s;
            box-shadow: 0 0 5px var(--primary);
        }

        /* ========== ANIMATED BACKGROUND ========== */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .animated-bg .circle {
            position: absolute;
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        [data-theme="light"] .animated-bg .circle { background: rgba(42, 157, 143, 0.15); }
        [data-theme="dark"] .animated-bg .circle { background: rgba(255, 255, 255, 0.05); }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-30px) translateX(20px) scale(1.05); opacity: 0.6; }
            100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
        }

        .circle-1 { width: 300px; height: 300px; top: 10%; left: -100px; animation-duration: 20s; }
        .circle-2 { width: 200px; height: 200px; bottom: 20%; right: -50px; animation-duration: 25s; animation-delay: -5s; }
        .circle-3 { width: 150px; height: 150px; top: 60%; left: 20%; animation-duration: 18s; animation-delay: -2s; }
        .circle-4 { width: 400px; height: 400px; bottom: -100px; left: 30%; animation-duration: 30s; animation-delay: -10s; }
        .circle-5 { width: 100px; height: 100px; top: 20%; right: 15%; animation-duration: 12s; animation-delay: -1s; }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.4;
            animation: particleMove 20s linear infinite;
        }
        [data-theme="dark"] .particle {
            background: rgba(255, 255, 255, 0.3);
        }
        @keyframes particleMove {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* ========== FLOATING BUTTONS ========== */
        .floating-contact, .back-to-top {
            position: fixed;
            bottom: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .floating-contact { left: 30px; }
        .back-to-top { right: 30px; }
        .floating-contact.show, .back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }
        .floating-contact:hover, .back-to-top:hover {
            transform: scale(1.1) rotate(10deg);
            background: var(--secondary);
        }

        /* ========== HEADER ========== */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            transition: var(--transition);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 70px;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .theme-toggle, .lang-switch {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text);
            padding: 0 15px;
            height: 40px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .theme-toggle:hover, .lang-switch:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ========== BOOKING SECTION ========== */
        .booking-section {
            padding: 120px 0 60px;
            min-height: 100vh;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        .back-link i {
            margin-left: 5px;
        }
        .back-link:hover {
            transform: translateX(-5px);
        }

        .booking-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* Package Summary Card (with 3D Tilt) */
        .package-summary {
            background: var(--bg-card);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }
        .package-summary:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover), var(--glow);
        }
        .package-summary img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .summary-content {
            padding: 25px;
        }
        .summary-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .summary-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }
        .summary-detail span:last-child {
            color: var(--primary);
            font-weight: bold;
        }
        .total-price {
            font-size: 2rem;
            font-weight: 900;
            color: var(--secondary);
            margin-top: 20px;
            text-align: left;
        }

        /* Booking Form Card */
        .booking-form {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(5px);
        }
        .booking-form h2 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(42,157,143,0.2);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-booking {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        .btn-booking::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn-booking:active::after {
            width: 200px;
            height: 200px;
        }
        .btn-booking:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(42,157,143,0.4);
        }

        /* Footer */
        footer {
            background: var(--bg-card);
            padding: 50px 0 20px;
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }
        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }
        .footer-section h4 {
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }
        .footer-section h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        .footer-section ul {
            list-style: none;
        }
        .footer-section a {
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s;
        }
        .footer-section a:hover {
            color: var(--primary);
        }
        .social-icons a {
            display: inline-flex;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            color: var(--text);
            margin-left: 10px;
            transition: 0.3s;
        }
        .social-icons a:hover {
            background: var(--primary);
            transform: translateY(-5px);
            color: #fff;
        }
        .copyright {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .booking-wrapper {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .booking-section {
                padding: 100px 20px 40px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        let theme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', theme);
        if (themeToggle) themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        themeToggle?.addEventListener('click', () => {
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // ========== LANGUAGE ==========
        let currentLang = localStorage.getItem('lang') || 'ar';
        const langToggle = document.getElementById('langToggle');
        const body = document.body;

        function updatePageContent(lang) {
            // Update text elements with data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            // Update package details
            const name = lang === 'ar' ? pkg.name_ar : pkg.name_en;
            const duration = lang === 'ar' ? pkg.duration_ar : pkg.duration_en;
            const persons = lang === 'ar' ? pkg.persons_ar : pkg.persons_en;
            document.getElementById('packageName').textContent = name;
            document.getElementById('packageDuration').textContent = duration;
            document.getElementById('packagePersons').textContent = persons;
            document.getElementById('packageDate').textContent = lang === 'ar' ? 'مرن حسب توفرك' : 'Flexible based on availability';
            document.getElementById('packageImage').src = pkg.image;
            document.getElementById('packageImage').alt = name;
            const priceEl = document.getElementById('packagePrice');
            priceEl.textContent = lang === 'ar' ? `${pkg.price} درهم` : `${pkg.price} MAD`;
        }

        function setLanguage(lang) {
            currentLang = lang;
            html.lang = lang;
            body.dir = lang === 'ar' ? 'rtl' : 'ltr';
            if (langToggle) langToggle.textContent = lang === 'ar' ? 'EN' : 'AR';
            localStorage.setItem('lang', lang);
            updatePageContent(lang);
        }
        setLanguage(currentLang);
        langToggle?.addEventListener('click', () => setLanguage(currentLang === 'ar' ? 'en' : 'ar'));

        // ========== SCROLL PROGRESS ==========
        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - window.innerHeight;
            const scrolled = (winScroll / height) * 100;
            const progressBar = document.getElementById('progressBar');
            if (progressBar) progressBar.style.width = scrolled + '%';
        });

        // ========== BACK TO TOP & FLOATING CONTACT ==========
        const backToTop = document.getElementById('backToTop');
        const floating = document.getElementById('floatingContact');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTop?.classList.add('show');
                floating?.classList.add('show');
            } else {
                backToTop?.classList.remove('show');
                floating?.classList.remove('show');
            }
        });
        backToTop?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        floating?.addEventListener('click', () => window.location.href = 'index.html#contact');

        // ========== 3D TILT EFFECT ON PACKAGE SUMMARY ==========
        const tiltCard = document.querySelector('.package-summary');
        if (tiltCard) {
            tiltCard.addEventListener('mousemove', (e) => {
                const rect = tiltCard.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 20;
                const rotateY = (centerX - x) / 20;
                tiltCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px)`;
            });
            tiltCard.addEventListener('mouseleave', () => {
                tiltCard.style.transform = '';
            });
        }

        // ========== PARTICLES GENERATOR ==========
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            if (!container) return;
            const particleCount = 60;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 15 + 10 + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // ========== FORM SUBMISSION ==========
        document.getElementById('bookingForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = {
                package: currentLang === 'ar' ? pkg.name_ar : pkg.name_en,
                name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                adults: document.getElementById('adults').value,
                children: document.getElementById('children').value,
                date: document.getElementById('departureDate').value,
                notes: document.getElementById('notes').value
            };
            console.log('Booking Data:', formData);
            alert(currentLang === 'ar' ? 'تم إرسال طلب الحجز بنجاح! سنتواصل معك قريباً.' : 'Booking request sent successfully! We will contact you soon.');
            e.target.reset();
        });

        // ========== AOS INIT ==========
        AOS.init({
            duration: 600,
            once: true,
            offset: 100,
        });
    </script>
</body>
</html>
