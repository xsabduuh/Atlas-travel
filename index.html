<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفاري | اختبار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #2a9d8f;
            --secondary: #e76f51;
            --bg-dark: #121212;
            --bg-card-dark: #1e1e1e;
            --text-dark: #fff;
            --bg-light: linear-gradient(135deg, #e0f7fa, #c8e6e0);
            --bg-card-light: rgba(255,255,255,0.9);
            --text-light: #1e3c3c;
        }
        [data-theme="dark"] { background: var(--bg-dark); color: var(--text-dark); }
        [data-theme="light"] { background: var(--bg-light); color: var(--text-light); }
        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; text-align: center; transition: 0.3s; }
        .card { background: var(--bg-card-light); padding: 20px; border-radius: 20px; margin: 20px auto; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        button { background: var(--primary); border: none; padding: 10px 20px; margin: 5px; border-radius: 30px; color: white; cursor: pointer; }
        .currency { font-weight: bold; }
    </style>
</head>
<body>
    <h1 data-i18n="hero_title">اكتشف جمال العالم مع سفاري</h1>
    <p data-i18n="hero_desc">رحلات مخصصة، عروض حصرية</p>

    <div class="card">
        <h3 data-i18n="package_paris_title">رحلة باريس</h3>
        <p><span class="price">799</span> <span class="currency">درهم</span></p>
        <button class="btn-secondary" data-i18n="book_now">احجز الآن</button>
    </div>

    <div class="card">
        <h3 data-i18n="package_bali_title">عطلة بالي</h3>
        <p><span class="price">649</span> <span class="currency">درهم</span></p>
        <button class="btn-secondary" data-i18n="book_now">احجز الآن</button>
    </div>

    <div>
        <button id="themeToggle">🌙</button>
        <button id="langToggle">EN</button>
    </div>

    <script>
        const translations = {
            ar: {
                hero_title: 'اكتشف جمال العالم مع سفاري',
                hero_desc: 'رحلات مخصصة، عروض حصرية',
                package_paris_title: 'رحلة باريس',
                package_bali_title: 'عطلة بالي',
                book_now: 'احجز الآن'
            },
            en: {
                hero_title: 'Discover the Beauty of the World with Safari',
                hero_desc: 'Tailored trips, exclusive offers',
                package_paris_title: 'Paris Trip',
                package_bali_title: 'Bali Getaway',
                book_now: 'Book Now'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'ar';
        let currentTheme = localStorage.getItem('theme') || 'light';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            document.querySelectorAll('.currency').forEach(el => {
                el.textContent = lang === 'ar' ? 'درهم' : 'MAD';
            });
            document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'AR';
        }

        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            setLanguage(currentLang === 'ar' ? 'en' : 'ar');
        });
        document.getElementById('themeToggle').addEventListener('click', () => {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        setLanguage(currentLang);
        setTheme(currentTheme);
    </script>
</body>
</html>
